services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    build: ./api
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  portfolio-net:
    driver: bridge